openapi: 3.1.0
info:
  title: IronShell Agent API
  version: 14.0.5
  description: >
    Structured JSON API for AI agents to interact with IronShell, a typed
    functional shell with 1,200+ builtins. Start the server with
    `ish agent serve` (default port 3002).


    Every route except `/health` requires a bearer token. The server mints one
    at startup and prints it, or set `IRONSHELL_API_TOKEN` to supply your own.
    This is not optional: the API evaluates arbitrary code, so an
    unauthenticated server lets any web page the user visits drive it from
    their browser. Binding a non-loopback address additionally requires
    `IRONSHELL_ALLOW_REMOTE_BIND=true`. The `Bearer` scheme word is
    case-insensitive (RFC 7235); the token is compared exactly.


    Every request is evaluated in a fresh environment: a variable assigned by
    one `/eval`, `/call` or `/pipeline` request is gone in the next, and the
    only state that persists between requests is the filesystem (inside the
    workspace). Approval for an effect that needs it is given only by the
    operator, through the `IRONSHELL_APPROVE` environment variable of the
    server process; a request cannot grant itself approval, and a call that
    needs it fails with `E_NEEDS_APPROVAL`.


    A relative path means one place for every builtin, reads and writes alike:
    the server runs from its workspace root (it moves there at startup when it
    was started outside it), so `file.write('b.txt', 'hi')` followed by
    `file.read('b.txt')` reads back what was written.


    Every failure, including the ones the HTTP layer produces itself (an
    unknown path, a wrong method, a malformed or oversized body, a wrong
    content type, a missing token), is JSON of the same shape: `success: false`
    and an `error` object with `code`, `message`, `hint` and `retryable`. Input
    echoed in a message is cut to about 200 characters.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
  contact:
    name: Nervosys
    url: https://github.com/nervosys/IronShell
    email: contact@nervosys.ai

servers:
  - url: http://localhost:3002
    description: Local development server

security:
  - bearerAuth: []

paths:
  /api/v1/execute:
    post:
      operationId: executeAction
      summary: Execute any AgentRequest action
      description: >
        Central dispatch endpoint. The `action` field determines what happens:
        call, pipeline, eval, schema, list_builtins, describe, type_info.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRequest'
            examples:
              callBuiltin:
                summary: Call a builtin function
                value:
                  action: call
                  builtin: ls
                  args:
                    path: "."
              evalCode:
                summary: Evaluate IronShell code
                value:
                  action: eval
                  code: "[1,2,3] | map(fn(x) => x * 2)"
              pipeline:
                summary: Run a multi-step pipeline
                value:
                  action: pipeline
                  steps:
                    - builtin: ls
                      args:
                        path: "./src"
                    - builtin: where
                      predicate: "size > 1024"
                    - builtin: select
                      args:
                        - name
                        - size
              getSchema:
                summary: Get schema for a specific AI provider
                value:
                  action: schema
                  format: openai
              listBuiltins:
                summary: List builtins in a category
                value:
                  action: list_builtins
                  category: file
      responses:
        '200':
          description: Successful execution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'

  /api/v1/call/{builtin}:
    post:
      operationId: callBuiltin
      summary: Call a specific builtin function by name
      parameters:
        - name: builtin
          in: path
          required: true
          schema:
            type: string
          description: >
            Builtin name, optionally module-qualified (e.g., "ls", "file.read",
            "sys.hostname", "crypto.uuid"). The tool names the `/schema`
            formats advertise are accepted exactly as written: `ironshell_sqrt`
            (the openai, claude, gemini and llama formats prefix a builtin's
            name with `ironshell_`; the other formats use the name as it is)
            calls `sqrt`. `/execute` with `action: call` takes the same names.
      requestBody:
        required: false
        description: >
          The arguments object itself. No body, or an empty one, is `{}`, with
          or without a Content-Type. A body that is not JSON is 400 E_PARSE.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Arguments to pass to the builtin
      responses:
        '200':
          description: Builtin result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '400':
          description: A failure (E_BAD_ARG, E_PARSE, ...), as `AgentResponse`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '404':
          description: No such builtin (E_UNKNOWN_BUILTIN, with did_you_mean candidates)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'

  /api/v1/pipeline:
    post:
      operationId: executePipeline
      summary: Execute a multi-step typed pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - steps
              properties:
                steps:
                  type: array
                  items:
                    $ref: '#/components/schemas/PipelineStep'
                  description: >
                    Ordered pipeline stages. A step's `builtin` takes the same
                    names as `/call`: bare, module-qualified (`arr.range`) or a
                    schema tool name (`ironshell_range`). A `steps` that is not
                    a list of steps is 400 E_BAD_ARG.
      responses:
        '200':
          description: Pipeline result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '400':
          description: >
            A failure. `error.code` is the failing step's own code (for
            example E_UNKNOWN_BUILTIN or E_BAD_ARG), or E_BAD_ARG for a
            pipeline that could not be built.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'

  /api/v1/eval:
    post:
      operationId: evalCode
      summary: Evaluate raw IronShell code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  description: IronShell code to evaluate
      responses:
        '200':
          description: Evaluation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'

  /api/v1/stream/execute:
    post:
      operationId: streamExecute
      summary: Stream execution results via SSE
      description: >
        Events are `start`, then `complete` (the result), or for an array
        longer than 50 rows ordered `chunk` events (`seq`, `rows`, `total`)
        and a `complete` of `{streamed_rows: total}`. A failure is an `error`
        event whose `data.error` is an object (`code`, `message`, `hint`,
        `retryable`), not a string.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRequest'
      responses:
        '200':
          description: SSE event stream
          content:
            text/event-stream: {}

  /api/v1/stream/pipeline:
    post:
      operationId: streamPipeline
      summary: Stream pipeline results via SSE
      description: >
        Events are `start`, a `progress` after each step that completed, then
        `complete` (the pipeline's result) or an `error` event naming the step
        that failed. `data.error` is an object (`code`, `message`, `hint`,
        `retryable`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - steps
              properties:
                steps:
                  type: array
                  items:
                    $ref: '#/components/schemas/PipelineStep'
      responses:
        '200':
          description: SSE event stream
          content:
            text/event-stream: {}

  /api/v1/stream/eval:
    post:
      operationId: streamEval
      summary: Stream eval results via SSE
      description: >
        The value arrives only in `chunk` events (`seq`, `rows`, `total`;
        50 items each), one item per element of an array result and a single
        item for any other value, so a scalar `1 + 2` is one `chunk` whose
        `rows` is `[3]`. The closing `complete` event carries only the count,
        `{streamed_items: n}` with result type `stream`: it does not repeat the
        value. A failure is an `error` event whose `data.error` is an object
        (`code`, `message`, `hint`, `retryable`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
      responses:
        '200':
          description: SSE event stream
          content:
            text/event-stream: {}

  /api/v1/ws:
    get:
      operationId: websocketConnect
      summary: Bidirectional WebSocket for real-time interaction
      description: >
        WebSocket endpoint for streaming, multi-turn conversations, and
        real-time pipeline monitoring. Send one JSON object per text frame.
        An AgentRequest such as `{"action":"eval","code":"1+2"}` is run and
        answered with `{"type":"response","id":ID,"response":AgentResponse}`,
        where ID is the request's own `"id"` string, or empty. The typed
        messages are `{"type":"execute","id":"1","request":{AgentRequest}}`,
        `ping`, `subscribe`, `unsubscribe`, `register`, `agent_message` and
        `broadcast`. A frame that is none of these (not JSON, binary, no
        `action` or `type`, a typed message with the wrong fields) is answered
        with `{"type":"error","id":ID,"message":"CODE: ...; send one JSON
        object per text frame: ..."}` naming the accepted shapes; no frame is
        ignored. The bearer token is sent on the upgrade request.
      responses:
        '101':
          description: WebSocket upgrade

  /api/v1/schema:
    get:
      operationId: getFullSchema
      summary: Get the complete JSON Schema ontology
      description: Returns all builtins, types, and capabilities as JSON Schema. Narrow it with `module` and `q`.
      parameters:
        - $ref: '#/components/parameters/SchemaModule'
        - $ref: '#/components/parameters/SchemaQuery'
      responses:
        '200':
          description: Full schema, or the filtered part of it
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Unknown module (E_BAD_ARG, with did_you_mean candidates in metadata)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'

  /api/v1/schema/{format}:
    get:
      operationId: getSchemaForProvider
      summary: Get schema formatted for a specific AI provider
      parameters:
        - name: format
          in: path
          required: true
          schema:
            type: string
            enum:
              - json_schema
              - openai
              - claude
              - gemini
              - llama
              - mistral
              - cohere
              - grok
              - deepseek
              - bedrock
              - azure_openai
              - qwen
              - ollama
              - vllm
              - huggingface
              - openrouter
              - kimi
              - yi
              - glm
              - reka
              - ai21
              - perplexity
              - together
              - groq
              - fireworks
              - ontology
          description: Target AI provider format
        - $ref: '#/components/parameters/SchemaModule'
        - $ref: '#/components/parameters/SchemaQuery'
      responses:
        '200':
          description: Provider-specific schema, or the filtered part of it
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Unknown format or module (E_BAD_ARG)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'

  /api/v1/builtins:
    get:
      operationId: listBuiltins
      summary: List all available builtins
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
          description: >
            Filter by category (the names in each entry's `category`, such as
            FileSystem or Math, case-insensitive) or by module name (`file`,
            `sys`, `math`: the builtins that module's members run). An unknown
            value is a 400 E_BAD_ARG that lists the valid categories.
      responses:
        '200':
          description: List of builtins with descriptions
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Unknown category or module (E_BAD_ARG)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'

  /api/v1/builtins/{name}:
    get:
      operationId: describeBuiltin
      summary: Get detailed description of a specific builtin
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Builtin name (e.g., "file.read", "ls", "sys.hostname")
      responses:
        '200':
          description: Builtin details
          content:
            application/json:
              schema:
                type: object

  /api/v1/types:
    get:
      operationId: getTypes
      summary: Get type system information
      responses:
        '200':
          description: Type definitions and relationships
          content:
            application/json:
              schema:
                type: object

  /api/v1/orchestration/metrics:
    get:
      operationId: orchestrationMetrics
      summary: Orchestrator metrics
      description: Counts and timings for workflows, tasks and agents.
      responses:
        '200':
          description: Metrics snapshot
  /api/v1/orchestration/workflows/{id}:
    get:
      operationId: getWorkflow
      summary: Fetch one workflow by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The workflow
        '404':
          description: No such workflow
  /api/v1/orchestration/workflows/{id}/cancel:
    post:
      operationId: cancelWorkflow
      summary: Cancel a running workflow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cancellation accepted
        '404':
          description: No such workflow
  /health:
    get:
      operationId: healthCheck
      summary: Health check endpoint
      # Exempt from the global bearer requirement so liveness probes work
      # without a credential -- matches the server, which lets /health through
      # the auth middleware unchecked.
      security: []
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  version:
                    type: string
                    example: 14.0.5

  /api/v1/orchestration/agents:
    get:
      operationId: listAgents
      summary: List registered agents
      responses:
        '200':
          description: Agent list
          content:
            application/json:
              schema:
                type: object
    post:
      operationId: registerAgent
      summary: Register a new agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Agent registered

  /api/v1/orchestration/tasks:
    post:
      operationId: createTask
      summary: Create a new task for agent execution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Task created

  /api/v1/orchestration/workflows:
    post:
      operationId: createWorkflow
      summary: Create a multi-agent workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Workflow created

  /api/v1/marketplace/publish:
    post:
      operationId: publishAgent
      summary: Announce an agent to subscribers of the agents channel
      description: >-
        Broadcasts the agent on the agents channel. The agent is not stored and
        is not sent to a marketplace registry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '202':
          description: Agent announced; not stored or sent to a registry
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  stored:
                    type: boolean
                    enum: [false]
                  message:
                    type: string

  /api/v1/marketplace/search:
    get:
      operationId: searchMarketplace
      summary: Search the agent marketplace
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Search query
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object

  /api/v1/marketplace/agents:
    get:
      operationId: listMarketplaceAgents
      summary: List all marketplace agents
      responses:
        '200':
          description: Agent catalog
          content:
            application/json:
              schema:
                type: object

  /api/v1/marketplace/install:
    post:
      operationId: installAgent
      summary: Install an agent from the marketplace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Agent installed

  /api/v1/marketplace/uninstall:
    post:
      operationId: uninstallAgent
      summary: Uninstall a marketplace agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Agent uninstalled

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Printed by the server at startup, or supplied via `IRONSHELL_API_TOKEN`.
        Compared in constant time.
  parameters:
    SchemaModule:
      name: module
      in: query
      required: false
      schema:
        type: string
      description: Only the builtins in this module, e.g. `file`. Case-insensitive. An unknown module is a 400.
    SchemaQuery:
      name: q
      in: query
      required: false
      schema:
        type: string
      description: Only the builtins whose name or description contains this text, case-insensitively. Empty means no filter.
  schemas:
    AgentRequest:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          enum:
            - call
            - pipeline
            - eval
            - schema
            - list_builtins
            - describe
            - type_info
          description: The action to perform
        builtin:
          type: string
          description: Builtin name (for call, describe actions)
        args:
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items:
                type: string
          description: Arguments for the builtin
        code:
          type: string
          description: IronShell code (for eval action)
        steps:
          type: array
          items:
            $ref: '#/components/schemas/PipelineStep'
          description: Pipeline steps (for pipeline action)
        format:
          type: string
          description: Schema format (for schema action)
        module:
          type: string
          description: Only the builtins in this module, e.g. `file` (for schema action)
        q:
          type: string
          description: Only the builtins whose name or description contains this, case-insensitively (for schema action)
        category:
          type: string
          description: Category or module name (for list_builtins); an unknown value is E_BAD_ARG
        type_name:
          type: string
          description: Type name (for type_info)

    PipelineStep:
      type: object
      required:
        - builtin
      properties:
        builtin:
          type: string
          description: Builtin function to call
        args:
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items:
                type: string
          description: Step arguments
        predicate:
          type: string
          description: Filter predicate expression

    AgentResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Whether the action succeeded
        result:
          description: The result value (type depends on the action)
        result_type:
          type: string
          description: IronShell type of the result (Int, String, Array, Record, etc.)
        error:
          type: object
          description: >-
            Present when success is false: `code` (E_BAD_ARG, E_PARSE,
            E_UNKNOWN_BUILTIN, E_NOT_FOUND, E_UNAUTHORIZED, E_BUDGET_EXCEEDED,
            ...), `message`, `hint` and `retryable`, plus any fields of a
            structured error. The same shape is used for failures of the HTTP
            layer itself (404, 405, 400, 401, 413, 415).
          properties:
            code:
              type: string
            message:
              type: string
            hint:
              type: string
            retryable:
              type: boolean
        code:
          type: string
          description: >-
            Machine-readable error code such as E_BAD_ARG or E_PARSE. Present only
            on a failure whose error carries one; read from the structured error
            in `error`, which is unchanged.
          example: E_BAD_ARG
        hint:
          type: string
          description: >-
            What to do about the failure, from the structured error in `error`.
            Present only when that error has a hint.
        metadata:
          type: object
          properties:
            duration_ms:
              type: number
              description: Execution time in milliseconds
